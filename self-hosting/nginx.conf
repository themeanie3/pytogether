# This stack is always fronted by a TLS-terminating proxy (Traefik + Cloudflare).
# Traefik's HTTP entrypoint OVERWRITES X-Forwarded-Proto to "http", which would
# trip Django's SECURE_SSL_REDIRECT into an infinite https redirect loop. Since
# public traffic is always HTTPS here, tell Django so unconditionally.
server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(groups|admin|api) {
        if ($http_accept ~* "text/html") {
            error_page 418 = @frontend;
            return 418;
        }

        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @frontend {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
