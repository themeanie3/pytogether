# Behind Traefik, TLS terminates at the edge and nginx is reached over plain HTTP.
# Trust the proto Traefik forwards; fall back to $scheme only if absent.
# Without this, X-Forwarded-Proto=http -> Django SECURE_SSL_REDIRECT -> redirect loop.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(groups|admin|api) {
        if ($http_accept ~* "text/html") {
            error_page 418 = @frontend;
            return 418;
        }

        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /ws/ {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location @frontend {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
